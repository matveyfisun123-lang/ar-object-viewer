
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Object Viewer</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #info {
      position: fixed;
      top: 15px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
    }
  </style>
</head>

<body>

<div id="info">
  <h2>AR Object Viewer</h2>
  <p id="status">Запуск камеры...</p>
  <p>Наведи камеру на маркер Hiro</p>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true"
  arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;">

  <a-marker preset="hiro">

    <a-box
      position="0 0.5 0"
      color="#2878ff"
      scale="0.7 0.7 0.7"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 5000">
    </a-box>

    <a-text
      value="AR OBJECT VIEWER"
      position="0 1.2 0"
      rotation="-90 0 0"
      align="center"
      color="white">
    </a-text>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>
  window.addEventListener("camera-init", function() {
    document.getElementById("status").innerText =
      "Камера запущена!";
  });

  window.addEventListener("camera-error", function() {
    document.getElementById("status").innerText =
      "Ошибка запуска камеры";
  });
</script>

</body>
</html>
