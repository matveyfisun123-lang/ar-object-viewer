
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101827">

<title>ORBIT AR Viewer</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  position: fixed;
  inset: 0;
  font-family: Arial, sans-serif;
  background: transparent;
}

/* Камера на весь экран iPhone */
#arjs-video {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  height: 100dvh !important;
  object-fit: cover !important;
  object-position: center center !important;
  margin: 0 !important;
  padding: 0 !important;
}

/* AR-сцена */
a-scene {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  height: 100dvh !important;
  overflow: hidden !important;
}

/* Холст должен совпадать с экраном */
a-scene canvas {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  height: 100dvh !important;
}

.topbar {
  position: fixed;
  z-index: 1000;
  top: calc(env(safe-area-inset-top) + 10px);
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  pointer-events: none;
}

.brand, .status {
  background: rgba(12,19,32,.88);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 14px;
  padding: 10px 12px;
  color: white;
  font-size: 12px;
  backdrop-filter: blur(12px);
}

.brand {
  font-weight: bold;
  letter-spacing: 1px;
}

.brand span {
  color: #75e0cf;
}

.status {
  text-align: right;
}

.panel {
  position: fixed;
  z-index: 1000;
  left: 12px;
  right: 12px;
  bottom: calc(env(safe-area-inset-bottom) + 10px);
  padding: 15px;
  border-radius: 20px;
  background: rgba(12,19,32,.92);
  border: 1px solid rgba(255,255,255,.15);
  color: white;
  backdrop-filter: blur(16px);
}

.heading {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

h1 {
  font-size: 17px;
  margin: 0 0 4px;
}

.subtitle {
  margin: 0;
  color: #aab8c8;
  font-size: 12px;
}

.tag {
  font-size: 10px;
  color: #75e0cf;
  border: 1px solid #75e0cf55;
  padding: 5px 8px;
  border-radius: 20px;
  height: max-content;
}

.description {
  color: #d7e2ed;
  font-size: 12px;
  line-height: 1.5;
  margin: 12px 0;
}

.controls {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

button {
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 12px;
  padding: 12px 5px;
  color: white;
  background: rgba(255,255,255,.07);
  font-size: 12px;
  font-weight: bold;
}

button.primary {
  background: #75e0cf;
  color: #10212a;
}

.hint {
  margin: 10px 2px 0;
  font-size: 10px;
  color: #9eacbd;
  text-align: center;
}

@media (min-width: 700px) {
  .panel {
    left: auto;
    right: 20px;
    bottom: 20px;
    width: 340px;
  }

  .topbar {
    top: 20px;
  }
}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand">AR <span>ORBIT</span></div>
  <div class="status" id="status">Ожидание Hiro</div>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; alpha: true"
  arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;">

  <a-marker preset="hiro" id="hiroMarker">

    <a-entity id="interactiveObject" position="0 0.15 0">

      <a-cylinder position="0 0.08 0"
        radius="0.48" height="0.12"
        color="#24364b" metalness="0.75">
      </a-cylinder>

      <a-cylinder position="0 0.16 0"
        radius="0.39" height="0.045"
        color="#75e0cf">
      </a-cylinder>

      <a-cylinder position="0 0.34 0"
        radius="0.045" height="0.34"
        color="#b7c7d8">
      </a-cylinder>

      <a-torus position="0 0.55 0"
        rotation="90 0 0"
        radius="0.28"
        radius-tubular="0.035"
        color="#75e0cf">
      </a-torus>

      <a-sphere position="0 0.55 0"
        radius="0.19"
        color="#dce9f5"
        metalness="0.72">
      </a-sphere>

      <a-sphere position="0 0.82 0"
        radius="0.075"
        color="#75e0cf">
      </a-sphere>

      <a-torus position="0 0.82 0"
        rotation="90 0 0"
        radius="0.13"
        radius-tubular="0.012"
        color="#dce9f5">
      </a-torus>

      <a-box position="0 0.03 0"
        width="0.22" height="0.025" depth="0.22"
        color="#152333">
      </a-box>

    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<div class="panel">
  <div class="heading">
    <div>
      <h1>ORBIT — 3D MODEL</h1>
      <p class="subtitle">Interactive augmented reality</p>
    </div>
    <span class="tag">AR / 3D</span>
  </div>

  <p class="description">
    Наведи камеру на маркер Hiro, чтобы увидеть
    трёхмерную модель ORBIT в дополненной реальности.
  </p>

  <div class="controls">
    <button id="rotate">↻ Вращать</button>
    <button id="up">＋ Увеличить</button>
    <button id="down">－ Уменьшить</button>
    <button id="reset" class="primary">Сбросить</button>
    <button id="info">О модели</button>
    <button id="pause">⏸ Пауза</button>
  </div>

  <p class="hint" id="hint">Управляй моделью с помощью кнопок</p>
</div>

<script>
(() => {
  const model = document.getElementById('interactiveObject');
  const marker = document.getElementById('hiroMarker');
  const status = document.getElementById('status');
  const hint = document.getElementById('hint');

  let scale = 1;
  let rotation = 0;
  let paused = false;

  function updateScale() {
    model.setAttribute('scale', `${scale} ${scale} ${scale}`);
  }

  function updateRotation() {
    model.setAttribute('rotation', `0 ${rotation} 0`);
  }

  document.getElementById('rotate').onclick = () => {
    if (!paused) {
      rotation += 45;
      updateRotation();
    }
  };

  document.getElementById('up').onclick = () => {
    if (!paused) {
      scale = Math.min(1.8, scale + 0.15);
      updateScale();
    }
  };

  document.getElementById('down').onclick = () => {
    if (!paused) {
      scale = Math.max(0.55, scale - 0.15);
      updateScale();
    }
  };

  document.getElementById('reset').onclick = () => {
    scale = 1;
    rotation = 0;
    updateScale();
    updateRotation();
    hint.textContent = 'Положение модели сброшено';
  };

  document.getElementById('info').onclick = () => {
    hint.textContent =
      'ORBIT — авторская модель из геометрических 3D-элементов.';
  };

  document.getElementById('pause').onclick = event => {
    paused = !paused;
    event.currentTarget.textContent =
      paused ? '▶ Продолжить' : '⏸ Пауза';

    hint.textContent = paused
      ? 'Управление приостановлено'
      : 'Управление включено';
  };

  marker.addEventListener('markerFound', () => {
    status.textContent = '✓ Маркер найден';
  });

  marker.addEventListener('markerLost', () => {
    status.textContent = 'Ожидание Hiro';
  });

  window.addEventListener('camera-init', () => {
    status.textContent = 'Камера подключена';
  });

  window.addEventListener('camera-error', () => {
    status.textContent = 'Ошибка камеры';
  });

  // Обновление размеров при повороте iPhone
  window.addEventListener('resize', () => {
    const scene = document.querySelector('a-scene');
    if (scene && scene.renderer) {
      scene.renderer.setSize(window.innerWidth, window.innerHeight);
    }
  });
})();
</script>

</body>
</html>
