
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#101827">
<title>AR Object Viewer — ORBIT</title>

<!-- Те же библиотеки, что в рабочем старом проекте -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

<style>
:root {
  --panel: rgba(12,19,32,.9);
  --line: rgba(255,255,255,.15);
  --accent: #75e0cf;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: #f4f7fb;
}

body {
  background: transparent;
}

.topbar {
  position: fixed;
  z-index: 1000;
  top: 12px;
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  pointer-events: none;
}

.brand, .status {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 12px;
  backdrop-filter: blur(12px);
  font-size: 12px;
}

.brand {
  font-weight: 800;
  letter-spacing: .08em;
}

.brand span {
  color: var(--accent);
}

.status {
  color: #d7e2ed;
  text-align: right;
}

.status i {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #f5c76b;
  margin-right: 7px;
}

.panel {
  position: fixed;
  z-index: 1000;
  left: 12px;
  right: 12px;
  bottom: 14px;
  padding: 15px;
  border-radius: 20px;
  background: var(--panel);
  border: 1px solid var(--line);
  backdrop-filter: blur(16px);
  box-shadow: 0 12px 40px #0006;
}

.heading {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

h1 {
  font-size: 17px;
  margin: 0 0 4px;
}

.subtitle {
  margin: 0;
  color: #aab8c8;
  font-size: 12px;
}

.tag {
  font-size: 10px;
  color: var(--accent);
  border: 1px solid #75e0cf55;
  padding: 5px 8px;
  border-radius: 99px;
  height: max-content;
}

.description {
  color: #d7e2ed;
  font-size: 12px;
  line-height: 1.5;
  margin: 12px 0;
}

.controls {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

button {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 11px 8px;
  color: #f4f7fb;
  background: #ffffff0d;
  font-size: 12px;
  font-weight: 650;
  touch-action: manipulation;
}

button.primary {
  background: var(--accent);
  color: #10212a;
  border-color: transparent;
}

.hint {
  margin: 10px 2px 0;
  font-size: 10px;
  color: #9eacbd;
  text-align: center;
}

@media (min-width: 700px) {
  .panel {
    left: auto;
    right: 20px;
    bottom: 20px;
    width: 340px;
  }

  .topbar {
    top: 20px;
    left: 20px;
    right: 20px;
  }
}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand">AR <span>OBJECT</span> VIEWER</div>

  <div class="status" id="status">
    <i></i>Ожидание маркера Hiro
  </div>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; alpha: true"
  arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;">

  <a-marker preset="hiro" id="hiroMarker">

    <a-entity
      id="interactiveObject"
      position="0 0.15 0"
      rotation="0 0 0"
      scale="1 1 1">

      <!-- Основание модели -->
      <a-cylinder
        position="0 0.08 0"
        radius="0.48"
        height="0.12"
        color="#24364b"
        metalness="0.75"
        roughness="0.28">
      </a-cylinder>

      <a-cylinder
        position="0 0.16 0"
        radius="0.39"
        height="0.045"
        color="#75e0cf"
        metalness="0.55">
      </a-cylinder>

      <!-- Центральная конструкция -->
      <a-cylinder
        position="0 0.34 0"
        radius="0.045"
        height="0.34"
        color="#b7c7d8"
        metalness="0.8">
      </a-cylinder>

      <a-torus
        position="0 0.55 0"
        rotation="90 0 0"
        radius="0.28"
        radius-tubular="0.035"
        color="#75e0cf">
      </a-torus>

      <a-sphere
        position="0 0.55 0"
        radius="0.19"
        color="#dce9f5"
        metalness="0.72"
        roughness="0.18">
      </a-sphere>

      <!-- Верхняя часть -->
      <a-sphere
        position="0 0.82 0"
        radius="0.075"
        color="#75e0cf"
        emissive="#174d48"
        emissive-intensity="0.5">
      </a-sphere>

      <a-torus
        position="0 0.82 0"
        rotation="90 0 0"
        radius="0.13"
        radius-tubular="0.012"
        color="#dce9f5">
      </a-torus>

      <a-box
        position="0 0.03 0"
        width="0.22"
        height="0.025"
        depth="0.22"
        color="#152333">
      </a-box>

    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<section class="panel">

  <div class="heading">
    <div>
      <h1>ORBIT — интерактивная модель</h1>
      <p class="subtitle">Авторская процедурная 3D-композиция</p>
    </div>
    <span class="tag">3D / AR</span>
  </div>

  <p class="description">
    Модель создана из геометрических элементов A-Frame.
    Наведите камеру на маркер Hiro, чтобы увидеть объект
    в дополненной реальности.
  </p>

  <div class="controls">
    <button id="rotate">↻ Вращать</button>
    <button id="scaleUp">＋ Увеличить</button>
    <button id="scaleDown">－ Уменьшить</button>
    <button id="reset" class="primary">Сбросить</button>
    <button id="info">О модели</button>
    <button id="pause">⏸ Пауза</button>
  </div>

  <p class="hint" id="hint">
    Используйте кнопки для управления моделью.
  </p>

</section>

<script>
(() => {

  const model = document.getElementById('interactiveObject');
  const marker = document.getElementById('hiroMarker');
  const status = document.getElementById('status');
  const hint = document.getElementById('hint');

  let scale = 1;
  let rotation = 0;
  let paused = false;

  // Изменение размера
  function setScale(value) {
    scale = Math.max(0.55, Math.min(1.8, value));

    model.setAttribute(
      'scale',
      `${scale} ${scale} ${scale}`
    );
  }

  // Изменение вращения
  function setRotation(value) {
    rotation = value;

    model.setAttribute(
      'rotation',
      `0 ${rotation} 0`
    );
  }

  // Вращение
  document.getElementById('rotate').onclick = () => {
    if (!paused) {
      setRotation(rotation + 45);
    }
  };

  // Увеличение
  document.getElementById('scaleUp').onclick = () => {
    if (!paused) {
      setScale(scale + 0.15);
    }
  };

  // Уменьшение
  document.getElementById('scaleDown').onclick = () => {
    if (!paused) {
      setScale(scale - 0.15);
    }
  };

  // Сброс
  document.getElementById('reset').onclick = () => {
    setScale(1);
    setRotation(0);

    hint.textContent =
      'Размер и положение модели сброшены.';
  };

  // Информация
  document.getElementById('info').onclick = () => {
    hint.textContent =
      'ORBIT — авторская 3D-композиция из цилиндров, сфер и колец.';
  };

  // Пауза
  document.getElementById('pause').onclick = event => {
    paused = !paused;

    event.currentTarget.textContent =
      paused ? '▶ Продолжить' : '⏸ Пауза';

    hint.textContent = paused
      ? 'Управление моделью приостановлено.'
      : 'Управление моделью включено.';
  };

  // Распознавание маркера
  marker.addEventListener('markerFound', () => {
    status.innerHTML =
      '<i style="background:#75e0cf"></i>Маркер найден · модель активна';
  });

  marker.addEventListener('markerLost', () => {
    status.innerHTML =
      '<i></i>Маркер не найден · наведите камеру на Hiro';
  });

  // Ошибки камеры
  window.addEventListener('camera-init', () => {
    status.innerHTML =
      '<i style="background:#75e0cf"></i>Камера подключена';
  });

  window.addEventListener('camera-error', () => {
    status.textContent = 'Ошибка запуска камеры';
  });

})();
</script>

</body>
</html>
