<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AR Object Viewer — WebAR</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#111}
    #panel{position:fixed;z-index:10;top:12px;left:12px;right:12px;padding:12px 14px;border-radius:12px;background:rgba(12,18,28,.82);color:white}
    #panel h1{font-size:18px;margin:0 0 6px}
    #panel p{font-size:13px;line-height:1.4;margin:0}
    #hint{margin-top:7px;color:#b9d7ff}
  </style>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/three.js/build/ar.js"></script>
</head>
<body>
  <div id="panel">
    <h1>AR Object Viewer</h1>
    <p>Наведи камеру на маркер Hiro. Когда маркер распознается, появится 3D-объект.</p>
    <p id="hint">Разреши доступ к камере и держи маркер в кадре.</p>
  </div>

  <a-scene embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true"
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">

    <a-marker preset="hiro">
      <a-entity position="0 0.45 0">
        <a-box position="0 0.35 0" depth="0.7" height="0.7" width="0.7"
               color="#2878ff" material="metalness: 0.25; roughness: 0.35">
          <a-animation attribute="rotation" to="0 360 0" dur="5000" easing="linear" repeat="indefinite"></a-animation>
        </a-box>
        <a-text value="AR Object Viewer" align="center" color="#ffffff"
                position="0 1.0 0" rotation="-90 0 0" width="3"></a-text>
        <a-cylinder position="0 -0.05 0" radius="0.42" height="0.08" color="#20c997"></a-cylinder>
      </a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
  <script>
    window.addEventListener('camera-init', function(){ document.getElementById('hint').textContent='Камера включена. Наведи её на маркер Hiro.'; });
    window.addEventListener('camera-error', function(){ document.getElementById('hint').textContent='Не удалось открыть камеру. Проверь разрешение и HTTPS-ссылку.'; });
  </script>
</body>
</html>
